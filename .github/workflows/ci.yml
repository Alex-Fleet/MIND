name: CI

# 门禁分层：lint（最快，先卡）→ 测试（慢，核心）。
# 依赖安全不在 push 管线上卡人——独立每周 cron（audit.yml）+ dependabot。
# 个人项目不做：多版本 matrix、多 OS、覆盖率门禁（协作项目复杂度）。

on:
  push:
  pull_request:

permissions:
  contents: read  # 最小权限

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # 新提交取消旧任务

jobs:
  lint-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      # action 钉 commit SHA（防供应链）；v4/v5 是移动 tag，SHA 指向对应版本
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"  # README 声明的最低支持版本
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest
